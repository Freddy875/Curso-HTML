<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Completo</title>
</head>
<body>

<h1>Formulario de Registro</h1>

<form>

<fieldset>
<legend>Información Personal</legend>

<!-- Campo para ingresar nombre -->
<label for="nombre">Nombre:</label>
<input type="text" id="nombre" name="nombre">

<br><br>

<!-- Campo para ingresar contraseña -->
<label for="password">Contraseña:</label>
<input type="password" id="password" name="password">

<br><br>

<!-- Campo para ingresar correo electrónico -->
<label for="email">Email:</label>
<input type="email" id="email" name="email">

<br><br>

<!-- Campo para seleccionar una fecha -->
<label for="fecha">Fecha:</label>
<input type="date" id="fecha" name="fecha">

<br><br>

<!-- Campo para seleccionar fecha y hora -->
<label for="fechahora">Fecha y hora:</label>
<input type="datetime" id="fechahora" name="fechahora">

<br><br>

<!-- Campo para seleccionar fecha y hora local -->
<label for="fechahoralocal">Fecha y hora local:</label>
<input type="datetime-local" id="fechahoralocal" name="fechahoralocal">

<br><br>

<!-- Campo para subir archivos -->
<label for="archivo">Subir archivo:</label>
<input type="file" id="archivo" name="archivo">

<br><br>

<!-- Campo para seleccionar mes -->
<label for="mes">Mes:</label>
<input type="month" id="mes" name="mes">

<br><br>

<!-- Campo numérico -->
<label for="numero">Número:</label>
<input type="number" id="numero" name="numero">

<br><br>

<!-- Campo de rango -->
<label for="rango">Rango:</label>
<input type="range" id="rango" name="rango">

<br><br>

<!-- Campo de búsqueda -->
<label for="buscar">Buscar:</label>
<input type="search" id="buscar" name="buscar">

<br><br>

<!-- Campo teléfono -->
<label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" name="telefono">

<br><br>

<!-- Campo hora -->
<label for="hora">Hora:</label>
<input type="time" id="hora" name="hora">

<br><br>

<!-- Campo URL -->
<label for="url">URL:</label>
<input type="url" id="url" name="url">

<br><br>

<!-- Campo semana -->
<label for="semana">Semana:</label>
<input type="week" id="semana" name="semana">

<br><br>

<!-- Campo para elegir color -->
<label for="color">Color favorito:</label>
<input type="color" id="color" name="color">

<br><br>

<!-- Área de texto -->
<label for="comentarios">Comentarios:</label>
<textarea id="comentarios" name="comentarios" rows="4" cols="40"></textarea>

</fieldset>

<br>

<fieldset>
<legend>Preferencias de Comida</legend>

<!-- Lista desplegable de desayuno -->
<label for="desayuno">Elige tu desayuno:</label>
<select id="desayuno" name="desayuno">
<option>Huevos</option>
<option>Hot Cakes</option>
<option>Chilaquiles</option>
<option>Avena</option>
<option>Sandwich</option>
</select>

<br><br>

<!-- Opción única entre hamburguesa o pizza -->
<p>Elige una comida rápida:</p>

<input type="radio" id="hamburguesa" name="fastfood" value="hamburguesa">
<label for="hamburguesa">Hamburguesa</label>

<br>

<input type="radio" id="pizza" name="fastfood" value="pizza">
<label for="pizza">Pizza</label>

<br><br>

<!-- Selección múltiple de postres -->
<p>Selecciona tus postres favoritos:</p>

<input type="checkbox" id="helado" name="postre" value="helado">
<label for="helado">Helado</label>

<br>

<input type="checkbox" id="pastel" name="postre" value="pastel">
<label for="pastel">Pastel</label>

<br>

<input type="checkbox" id="galletas" name="postre" value="galletas">
<label for="galletas">Galletas</label>

</fieldset>

<br>

<!-- Botón para enviar formulario -->
<input type="submit" value="Enviar">

<!-- Botón para limpiar formulario -->
<input type="reset" value="Restablecer">

</form>

</body>
</html>
