<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Figuras básicas en SVG</title>
</head>

<body>

<h1>Figuras básicas</h1>

<ul>

<li>
Círculo
</li>
<svg width="120" height="120">
<circle cx="60" cy="60" r="40" fill="black" stroke="red" stroke-width="3"/>
</svg>


<li>
Cuadrado
</li>
<svg width="120" height="120">
<rect x="20" y="20" width="80" height="80" fill="black" stroke="red" stroke-width="3"/>
</svg>


<li>
Rectángulo
</li>
<svg width="160" height="120">
<rect x="20" y="30" width="120" height="60" fill="black" stroke="red" stroke-width="3"/>
</svg>


<li>
Elipse
</li>
<svg width="160" height="120">
<ellipse cx="80" cy="60" rx="60" ry="35" fill="black" stroke="red" stroke-width="3"/>
</svg>


<li>
Línea
</li>
<svg width="160" height="120">
<line x1="20" y1="60" x2="140" y2="60" stroke="red" stroke-width="4"/>
</svg>


<li>
Triángulo
</li>
<svg width="140" height="120">
<polygon points="70,20 120,100 20,100" fill="black" stroke="red" stroke-width="3"/>
</svg>


</ul>

</body>
</html>
