<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los siete hábitos de la gente altamente efectiva</title>
</head>
<body>
    <h1>Los siete hábitos de la gente altamente efectiva de Stephen Covey</h1>  
    
    <svg width="100%" viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg">

  <!-- White background -->
  <rect width="680" height="920" fill="#ffffff"/>

  <!-- Purple top banner -->
  <rect x="0" y="0" width="680" height="68" fill="#7B3FA0"/>
  <text x="340" y="43"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="3">EDICIÓN REVISADA Y ACTUALIZADA</text>

  <!-- Author -->
  <text x="340" y="148"
    font-family="Arial Black, Arial, sans-serif"
    font-size="60"
    font-weight="900"
    fill="#111111"
    text-anchor="middle"
    letter-spacing="2">STEPHEN R. COVEY</text>

  <!-- Shadow 7 -->
  <text x="82" y="570"
    font-family="Arial Black, Arial, sans-serif"
    font-size="430"
    font-weight="900"
    fill="#C97A5A">7</text>

  <!-- Front 7 -->
  <text x="72" y="560"
    font-family="Arial Black, Arial, sans-serif"
    font-size="430"
    font-weight="900"
    fill="#7B3FA0">7</text>

  <!-- LOS -->
  <text x="68" y="430"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700"
    fill="#111111">LOS</text>

  <!-- HÁBITOS -->
  <text x="280" y="455"
    font-family="Arial Black, Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="#7B3FA0">HÁBITOS</text>

  <!-- DE LA -->
  <text x="310" y="520"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="700"
    fill="#111111">DE LA</text>

  <!-- GENTE -->
  <text x="260" y="600"
    font-family="Arial Black, Arial, sans-serif"
    font-size="100"
    font-weight="900"
    fill="#7B3FA0">GENTE</text>

  <!-- ALTAMENTE -->
  <text x="340" y="695"
    font-family="Arial Black, Arial, sans-serif"
    font-size="82"
    font-weight="900"
    fill="#111111"
    text-anchor="middle">ALTAMENTE</text>

  <!-- EFECTIVA -->
  <text x="340" y="800"
    font-family="Arial Black, Arial, sans-serif"
    font-size="105"
    font-weight="900"
    fill="#7B3FA0"
    text-anchor="middle">EFECTIVA</text>

  <!-- Badge -->
  <circle cx="566" cy="310" r="78" fill="#C97A5A"/>

  <!-- Badge text -->
  <text x="566" y="286"
    font-family="Arial Black, Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="#111111"
    text-anchor="middle">40</text>

  <text x="566" y="314"
    font-family="Arial Black, Arial, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#111111"
    text-anchor="middle">MILLONES DE</text>

  <text x="566" y="331"
    font-family="Arial Black, Arial, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#111111"
    text-anchor="middle">EJEMPLARES</text>

  <text x="566" y="348"
    font-family="Arial Black, Arial, sans-serif"
    font-size="11"
    font-weight="700"
    fill="#111111"
    text-anchor="middle">VENDIDOS</text>

  <!-- Purple bottom banner -->
  <rect x="0" y="892" width="680" height="28" fill="#7B3FA0"/>

</svg>
    
</body>
</html>
