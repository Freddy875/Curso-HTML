<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Los 7 hábitos de la gente altamente efectiva</title>
</head>
<body>

<h1>Los 7 hábitos de la gente altamente efectiva</h1>

<svg width="400px" viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg">

  <!-- White background -->
  <rect width="680" height="920" fill="#ffffff"/>

  <!-- Purple top banner -->
  <rect x="0" y="0" width="680" height="68" fill="#7B3FA0"/>
  <text x="340" y="43"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="3">EDICIÓN REVISADA Y ACTUALIZADA</text>

  <!-- STEPHEN R. COVEY -->
  <text x="340" y="148"
    font-family="Arial Black, Arial, sans-serif"
    font-size="60"
    font-weight="900"
    fill="#111111"
    text-anchor="middle"
    letter-spacing="2">STEPHEN R. COVEY</text>

  <!-- Big 7 shadow (3D effect - coral/salmon) -->
  <text x="82" y="570"
    font-family="Arial Black, Arial, sans-serif"
    font-size="430"
    font-weight="900"
    fill="#C97A5A"
    text-anchor="start"
    opacity="1">7</text>

  <!-- Big 7 front (purple) -->
  <text x="72" y="560"
    font-family="Arial Black, Arial, sans-serif"
    font-size="430"
    font-weight="900"
    fill="#7B3FA0"
    text-anchor="start">7</text>

  <!-- LOS (small, left of 7) -->
  <text x="68" y="430"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700"
    fill="#111111"
    text-anchor="start">LOS</text>

  <!-- HÁBITOS (right of 7, mid height) -->
  <text x="280" y="455"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="900"
    fill="#111111"
    text-anchor="start">HÁBITOS</text>

  <!-- DE LA -->
  <text x="310" y="520"
    font-family="Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="700"
    fill="#111111"
    text-anchor="start">DE LA</text>

  <!-- GENTE (purple) -->
  <text x="260" y="600"
    font-family="Arial Black, Arial, sans-serif"
    font-size="100"
    font-weight="900"
    fill="#7B3FA0"
    text-anchor="start">GENTE</text>

  <!-- ALTAMENTE -->
  <text x="340" y="695"
    font-family="Arial Black, Arial, sans-serif"
    font-size="82"
    font-weight="900"
    fill="#111111"
    text-anchor="middle">ALTAMENTE</text>

  <!-- EFECTIVA (purple) -->
  <text x="340" y="800"
    font-family="Arial Black, Arial, sans-serif"
    font-size="105"
    font-weight="900"
    fill="#7B3FA0"
    text-anchor="middle">EFECTIVA</text>

  <!-- Badge circle (salmon/copper) -->
  <circle cx="566" cy="310" r="88" fill="#C97A5A"/>

  <!-- Badge text -->
  <text x="566" y="282"
    font-family="Arial Black, Arial, sans-serif"
    font-size="42"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle">40</text>
  <text x="566" y="308"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1">MILLONES DE</text>
  <text x="566" y="328"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1">EJEMPLARES</text>
  <text x="566" y="348"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="1">VENDIDOS</text>
