<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Comidas</title>
</head>
<body>

    <h1>Galería de Comidas</h1>

    <figure>
        <img src="IMG/Hamburguesa.jpeg"
             alt="Hamburguesa con papas"
             width="400">

        <figcaption>
            <strong>Hamburguesa con papas</strong><br>
            Una deliciosa hamburguesa acompañada de papas fritas.
        </figcaption>
    </figure>

    <figure>
        <img src="IMG/Pizza.jpeg"
             alt="Pizza de pepperoni"
             width="400">

        <figcaption>
            <strong>Pizza de pepperoni</strong><br>
            Pizza preparada con queso, salsa de tomate y pepperoni.
        </figcaption>
    </figure>

    <figure>
        <img src="IMG/RedVelvet.png"
             alt="Pastel Red Velvet"
             width="400">

        <figcaption>
            <strong>Pastel Red Velvet</strong><br>
            Un pastel esponjoso con cobertura de queso crema.
        </figcaption>
    </figure>

    <figure>
        <img src="IMG/Limonada.png"
             alt="Limonada"
             width="400">

        <figcaption>
            <strong>Limonada</strong><br>
            Bebida refrescante preparada con limón, agua y azúcar.
        </figcaption>
    </figure>

</body>
</html>
