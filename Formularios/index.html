<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>
<body>

<h1>Formulario de Usuario</h1>

<form>

    <fieldset>
        <legend>Datos personales</legend>

        <!-- Campo con placeholder -->
        <label for="nombre">
            Nombre:
        </label>
        <input 
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre">

        <br><br>

        <!-- Campo con value (dato diferente) -->
        <label for="ciudad">
            Ciudad:
        </label>
        <input 
            type="text"
            id="ciudad"
            name="ciudad"
            value="CDMX">

    </fieldset>

</form>

</body>
</html>
